---
name: dados dos apps
on:
  repository_dispatch:
    types: [relay]
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency: relay
jobs:
  relay:
    runs-on: ubuntu-latest
    env:
      TZ: America/Sao_Paulo
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          TS=$(python3 tools/relayin.py)
          git config user.name "drom-bot"; git config user.email "drom-bot@users.noreply.github.com"
          git add tools/sync/inbox 2>/dev/null || true
          if ! git diff --cached --quiet; then git commit -m "contratos/cadastros (caixa de entrada)" && (git push || (git pull --rebase && git push)) && gh workflow run sheet.yml -f dry=0; fi
          [ -n "$TS" ] && curl -sL "$(cat tools/suburl.txt)?gh=ack&ts=$TS" >/dev/null || true
        env:
          DROM_PIN: ${{ secrets.DROM_PIN }}
          GH_TOKEN: ${{ github.token }}
