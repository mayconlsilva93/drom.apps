---
name: dados dos apps
on:
  repository_dispatch:
    types: [relay]
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: relay
jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          TS=$(python3 tools/relayin.py)
          git config user.name "drom-bot"; git config user.email "drom-bot@users.noreply.github.com"
          git add */d.json painel/pd.json booker/bk.json
          git diff --cached --quiet || (git commit -m "dados apps" && git pull --rebase && git push)
          [ -n "$TS" ] && curl -sL "$(cat tools/suburl.txt)?gh=ack&ts=$TS" >/dev/null || true
        env:
          DROM_PIN: ${{ secrets.DROM_PIN }}
