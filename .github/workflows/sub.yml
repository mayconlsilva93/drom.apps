name: cadastro de aparelho
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
concurrency: notify
jobs:
  sub:
    if: startsWith(github.event.issue.title, 'sub ')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: cadastrar
        env:
          DROM_PIN: ${{ secrets.DROM_PIN }}
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
        run: |
          APP="${TITLE#sub }"; printf '%s' "$BODY" > /tmp/b.json
          node tools/addsub.mjs "$APP" /tmp/b.json
          git config user.name "drom-bot"; git config user.email "drom-bot@users.noreply.github.com"
          git add "$APP/subs.json"; git diff --cached --quiet || (git commit -m "novo aparelho ($APP)" && git pull --rebase && git push)
      - name: fechar aviso
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }} && gh issue lock ${{ github.event.issue.number }} --repo ${{ github.repository }} || true
